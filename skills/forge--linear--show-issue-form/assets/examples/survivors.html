<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>幸存者试炼 · 升级 Feature 示例</title><style>
*{box-sizing:border-box}body{font:14px/1.7 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#171717;background:white;max-width:1000px;margin:30px auto;padding:0 24px}header{display:flex;align-items:start;justify-content:space-between;gap:20px;border-bottom:1px solid #ddd;margin-bottom:20px}h1{font-size:28px;margin:0 0 8px}p{color:#666}button{font:inherit;padding:10px 16px;border:1px solid #999;border-radius:0;background:white;color:#171717;cursor:pointer}button:hover{background:#eee}button:focus-visible{outline:2px solid #171717;outline-offset:3px}.hud{display:flex;gap:14px 26px;flex-wrap:wrap;margin-bottom:16px}.hud span{font-variant-numeric:tabular-nums}.arena{position:relative;border:1px solid #aaa}canvas{display:block;width:100%;height:auto;background:#f7f7f7}#start{margin:20px 8px 12px 0}dialog{width:min(520px,calc(100vw - 36px));border:1px solid #999;border-radius:0;padding:24px;background:#fff}dialog::backdrop{background:rgba(0,0,0,.35)}dialog h2{margin:0 0 8px;font-size:22px}.choices{display:flex;flex-direction:column;gap:12px;margin-top:22px}.choices button{text-align:left}.note{font-size:12px}#message{font-size:13px;min-height:24px;color:#555}
</style></head><body><header><div><h1>幸存者试炼</h1><p>自动攻击周围敌人；升级时暂停，选择一项强化后继续。</p></div><button id=restart>重新开始</button></header><div class=hud><span>状态：<strong id=mode>待开始</strong></span><span>等级：<strong id=level>1</strong></span><span>经验：<strong id=xp>4 / 5</strong></span><span>生命：<strong id=hp>100 / 100</strong></span><span>攻击：<strong id=attack>10</strong></span><span>移速：<strong id=speed>120</strong></span><span>战斗计时：<strong id=time>00:00</strong></span><span>击杀：<strong id=kills>0</strong></span></div><div class=arena><canvas id=arena width=720 height=400 tabindex=0 aria-label="战斗画布"></canvas></div><button id=start>开始挑战</button><div id=message role=status>固定升级夹具：初始经验 4 / 5，首个敌人提供 1 点经验。</div><p class=note>本地玩家 player-local，无需登录或组织。WASD／方向键移动，自动攻击。这是升级流程的可操作原型，不含完整关卡、随机技能或存档。</p><dialog id=upgrade aria-labelledby=upgrade-title><h2 id=upgrade-title>升到2级：选择强化</h2><p>战斗已暂停。选择一项强化后继续。</p><div class=choices><button data-choice=power>力量 +20%</button><button data-choice=speed>移速 +20%</button><button data-choice=life>生命上限 +20</button></div></dialog><script>
(()=>{'use strict';const $=s=>document.querySelector(s),canvas=$('#arena'),ctx=canvas.getContext('2d'),dialog=$('#upgrade');let state,keys=new Set(),last=performance.now(),acc=0;function reset(){if(dialog.open)dialog.close();state={mode:'ready',ticks:0,level:1,xp:4,need:5,hp:100,maxHp:100,attack:10,speed:120,kills:0,x:360,y:200,enemy:{x:405,y:200,hp:10},flash:0};keys.clear();acc=0;last=performance.now();$('#start').disabled=false;$('#message').textContent='固定升级夹具：初始经验 4 / 5，首个敌人提供 1 点经验。';paint();}
function render(){for(const [id,value]of Object.entries({mode:state.mode==='ready'?'待开始':state.mode==='upgrade'?'升级选择':'战斗中',level:state.level,xp:state.xp+' / '+state.need,hp:state.hp+' / '+state.maxHp,attack:state.attack,speed:state.speed,kills:state.kills,time:String(Math.floor(state.ticks/3600)).padStart(2,'0')+':'+String(Math.floor(state.ticks/60)%60).padStart(2,'0')}))$('#'+id).textContent=value;}
function paint(){ctx.clearRect(0,0,720,400);ctx.strokeStyle='#ddd';ctx.lineWidth=1;for(let x=0;x<=720;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,400);ctx.stroke()}for(let y=0;y<=400;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(720,y);ctx.stroke()}ctx.fillStyle='#171717';ctx.beginPath();ctx.arc(state.x,state.y,12,0,Math.PI*2);ctx.fill();ctx.font='12px sans-serif';ctx.fillText('玩家',state.x-12,state.y-20);if(state.enemy){const e=state.enemy;ctx.fillStyle='#777';ctx.fillRect(e.x-10,e.y-10,20,20);ctx.fillText('敌人 '+Math.max(0,e.hp),e.x-15,e.y-18);if(state.flash>0){ctx.strokeStyle='#171717';ctx.beginPath();ctx.moveTo(state.x,state.y);ctx.lineTo(e.x,e.y);ctx.stroke();state.flash--;}}render();}
function tick(){if(state.mode!=='playing')return;state.ticks++;let dx=(keys.has('d')||keys.has('ArrowRight')?1:0)-(keys.has('a')||keys.has('ArrowLeft')?1:0),dy=(keys.has('s')||keys.has('ArrowDown')?1:0)-(keys.has('w')||keys.has('ArrowUp')?1:0);const len=Math.hypot(dx,dy)||1;state.x=Math.max(14,Math.min(706,state.x+dx/len*state.speed/60));state.y=Math.max(14,Math.min(386,state.y+dy/len*state.speed/60));if(state.enemy&&state.ticks%60===0){state.enemy.hp-=state.attack;state.flash=6;if(state.enemy.hp<=0){state.enemy=null;state.kills++;state.xp++;if(state.xp>=state.need){state.mode='upgrade';keys.clear();dialog.showModal();$('#message').textContent='等待选择强化，战斗计时和移动暂停。';}}}if(state.mode==='playing'&&!state.enemy)state.enemy={x:620,y:90,hp:100};if(state.mode==='playing'&&state.enemy){const e=state.enemy,vx=state.x-e.x,vy=state.y-e.y,d=Math.hypot(vx,vy)||1;e.x+=vx/d*.15;e.y+=vy/d*.15;}}
function frame(now){acc+=Math.min(.1,(now-last)/1000);last=now;while(acc>=1/60){tick();acc-=1/60;}paint();requestAnimationFrame(frame)}$('#start').addEventListener('click',()=>{if(state.mode!=='ready')return;state.mode='playing';last=performance.now();acc=0;$('#start').disabled=true;$('#message').textContent='自动攻击中，首个敌人被击败后进入升级选择。';canvas.focus();paint()});for(const b of document.querySelectorAll('[data-choice]'))b.addEventListener('click',()=>{if(state.mode!=='upgrade')return;const choice=b.dataset.choice;if(choice==='power')state.attack=12;if(choice==='speed')state.speed=144;if(choice==='life'){state.maxHp=120;state.hp=120;}state.level=2;state.xp=0;state.need=8;state.mode='playing';state.enemy={x:620,y:90,hp:100};last=performance.now();acc=0;dialog.close();$('#message').textContent='已选择“'+b.textContent+'”，战斗继续。';canvas.focus();paint()});dialog.addEventListener('cancel',e=>e.preventDefault());$('#restart').addEventListener('click',reset);window.addEventListener('keydown',e=>{if(['w','a','s','d','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)){if(state.mode==='playing'){e.preventDefault();keys.add(e.key);}}});window.addEventListener('keyup',e=>keys.delete(e.key));window.addEventListener('blur',()=>keys.clear());reset();requestAnimationFrame(frame);})();
</script></body></html>
