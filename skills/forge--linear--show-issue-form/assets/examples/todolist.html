<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Todo List · 本地功能示例</title><style>
*{box-sizing:border-box}body{font:15px/1.7 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#171717;background:#fff;max-width:760px;margin:48px auto;padding:0 24px}h1{font-size:30px;margin:0 0 8px;font-weight:600}p{color:#666;margin:0 0 24px}header{display:flex;align-items:start;justify-content:space-between;gap:20px;border-bottom:1px solid #ddd;padding-bottom:24px}button,input{font:inherit;color:inherit;border:1px solid #aaa;background:#fff;padding:9px 12px;border-radius:0}button{cursor:pointer}button:hover{background:#f5f5f5}button:focus-visible,input:focus-visible{outline:2px solid #171717;outline-offset:3px}form{display:grid;grid-template-columns:1fr auto;gap:10px;margin-top:28px}label[for=task-title]{grid-column:1/-1;font-size:13px}input[type=text]{min-width:0}input[type=checkbox]{width:18px;height:18px;margin-right:12px;accent-color:#171717}#error{grid-column:1/-1;font-size:13px;color:#171717;min-height:24px}nav{display:flex;gap:20px;margin:20px 0;border-bottom:1px solid #ddd}nav button{border:0;border-bottom:2px solid transparent;padding:8px 0;color:#777}nav button[aria-pressed=true]{border-bottom-color:#171717;color:#171717}ul{padding:0;list-style:none;margin:0}li{padding:16px 0;border-bottom:1px solid #e8e8e8}li label{display:flex;align-items:center;cursor:pointer}.done{text-decoration:line-through;color:#777}.record-id{font-size:11px;color:#888;margin-left:30px}#counts{font-size:13px;margin-top:24px;color:#555}#notice{font-size:12px;margin-top:20px}#empty{padding:24px 0;color:#777}@media(max-width:520px){body{margin:24px auto}header{flex-wrap:wrap}form{grid-template-columns:1fr}form button{justify-self:start}}
</style></head><body><header><div><h1>Todo List</h1><p>新增、完成与筛选待办。数据只保存在当前浏览器。</p></div><button id=reset type=button>重置数据</button></header><form id=add-task><label for=task-title>待办内容</label><input id=task-title type=text autocomplete=off><button type=submit>添加待办</button><div id=error role=alert></div></form><nav aria-label="任务筛选"><button type=button data-filter=all aria-pressed=true>全部</button><button type=button data-filter=active aria-pressed=false>未完成</button><button type=button data-filter=done aria-pressed=false>已完成</button></nav><ul id=tasks aria-label="待办列表"></ul><div id=empty hidden>暂无待办</div><div id=counts role=status></div><p id=notice>本地用户 browser-local，无需登录、无组织；这是配套验收示例的可操作原型。</p><script>
(()=>{'use strict';const key='forge-issue-todo-feature-v1';const seed=()=>[{id:'todo-001',title:'买牛奶',done:false},{id:'todo-002',title:'阅读20分钟',done:false}];let data=seed(),filter='all',storage=true;const q=new URLSearchParams(location.search);try{if(q.get('reset')!=='1'){const saved=JSON.parse(localStorage.getItem(key)||'null');if(Array.isArray(saved)&&saved.every(t=>typeof t.id==='string'&&typeof t.title==='string'&&typeof t.done==='boolean'))data=saved;}}catch{storage=false}function save(){try{localStorage.setItem(key,JSON.stringify(data));}catch{storage=false;document.querySelector('#notice').textContent='浏览器存储不可用：可操作当前页面，刷新保留暂不可验证。';}}if(q.get('reset')==='1'){save();q.delete('reset');try{history.replaceState(null,'',location.pathname+'?'+q.toString());}catch{}}
function render(){const list=document.querySelector('#tasks');list.replaceChildren();const rows=data.filter(t=>filter==='all'||(filter==='done'?t.done:!t.done));for(const task of rows){const li=document.createElement('li'),label=document.createElement('label'),box=document.createElement('input'),text=document.createElement('span'),id=document.createElement('div');box.type='checkbox';box.checked=task.done;box.setAttribute('aria-label','完成：'+task.title);box.addEventListener('change',()=>{task.done=box.checked;save();render()});text.textContent=task.title;if(task.done)text.className='done';label.append(box,text);id.className='record-id';id.textContent=task.id;li.append(label,id);list.append(li);}document.querySelector('#empty').hidden=rows.length!==0;document.querySelector('#counts').textContent=`全部 ${data.length} · 未完成 ${data.filter(t=>!t.done).length} · 已完成 ${data.filter(t=>t.done).length}`;for(const button of document.querySelectorAll('[data-filter]'))button.setAttribute('aria-pressed',String(button.dataset.filter===filter));}
document.querySelector('#add-task').addEventListener('submit',event=>{event.preventDefault();const input=document.querySelector('#task-title'),title=input.value.trim(),error=document.querySelector('#error');if(!title){error.textContent='请输入待办内容';return}if(Array.from(title).length>80){error.textContent='待办内容最多80字';return}error.textContent='';const next=data.reduce((n,t)=>Math.max(n,Number(t.id.split('-')[1])||0),0)+1;data.push({id:'todo-'+String(next).padStart(3,'0'),title,done:false});input.value='';save();render();input.focus()});for(const button of document.querySelectorAll('[data-filter]'))button.addEventListener('click',()=>{filter=button.dataset.filter;render()});document.querySelector('#reset').addEventListener('click',()=>{data=seed();filter='all';document.querySelector('#task-title').value='';document.querySelector('#error').textContent='';save();render()});save();render();})();
</script></body></html>
