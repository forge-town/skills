<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Issue story video</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="css/video.css">
</head>
<body>
<main class="wrap">
  <header class="slate"><b id="title"></b><span id="hint">Space 播放/暂停 · M 静音 · C 字幕 · ←/→ 5s</span><a id="lang-link" hidden></a></header>
  <div class="stage" id="stage" tabindex="0" aria-label="Issue story video">
    <canvas id="cv" aria-hidden="true"></canvas>
    <div class="overlay" id="overlay"></div>
    <button class="poster" id="poster" type="button">▶ 播放（开启声音）</button>
    <noscript><p class="noscript">此视频预览需要 JavaScript。Issue 规格请查看 issue.md / issue.html。</p></noscript>
  </div>
  <p class="caption" id="caption" hidden aria-live="polite"></p>
  <div class="transport">
    <button type="button" id="play" aria-label="Play">▶</button>
    <button type="button" id="restart" aria-label="Restart">⟲</button>
    <input type="range" id="scrub" min="0" max="60" step="0.01" value="0" aria-label="Seek">
    <span class="tc" id="tc">00:00 / 00:00</span>
    <label class="rate"><span id="rate-label">速度</span> <select id="rate" aria-label="Playback rate"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option><option value="2">2×</option></select></label>
    <button type="button" id="cc" aria-pressed="true" aria-label="Captions">CC</button>
    <button type="button" id="mute" aria-pressed="false" aria-label="Mute">🔊</button>
    <input type="range" id="volume" min="0" max="1" step="0.01" value="0.8" aria-label="Volume">
    <label class="music"><span id="music-label">Music</span> <input type="range" id="music" min="0" max="1" step="0.01" value="1" aria-label="Music"></label>
  </div>
  <nav class="chapters" id="chapters" aria-label="Chapters"></nav>
  <p class="note" id="voice-note"></p>
  <p class="note" id="status" role="status"></p>
</main>
<!-- classic scripts (no ES modules, no fetch for core code) so this opens from file:// -->
<script src="js/core/util.js"></script>
<script src="js/core/clock.js"></script>
<script src="js/audio/score.js"></script>
<script src="js/core/timeline.js"></script>
<script src="js/audio/synth.js"></script>
<script src="js/audio/engine.js"></script>
<script src="js/visual/particles.js"></script>
<script src="js/visual/atmosphere.js"></script>
<script src="js/visual/task-visuals.js"></script>
<script src="js/visual/overlay.js"></script>
<script src="js/data/themes.js"></script>
<script src="js/data/media.js"></script>
<script src="js/data/story.js"></script>
<script src="js/ui/player.js"></script>
</body>
</html>
